<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive EB Bill Calculator</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas library for exporting to image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Wrapper card designated for export capture -->
    <div id="captureArea" class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 backdrop-blur-md">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">EB Bill Calculator</h1>
            <p class="text-sm text-slate-400 mt-1">Calculate your electricity consumption cost instantly</p>
        </div>

        <!-- Custom Notification Box (replaces alert) -->
        <div id="errorBox" class="hidden mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm flex items-center space-x-3">
            <svg class="w-5 h-5 text-rose-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span id="errorMessage"></span>
        </div>

        <!-- Inputs Form (hidden from export screenshot if needed, or included as part of summary) -->
        <div class="space-y-4">
            <div>
                <label for="prevReading" class="block text-sm font-medium text-slate-300 mb-1">Previous Meter Reading</label>
                <input type="number" id="prevReading" placeholder="e.g. 1500" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="currReading" class="block text-sm font-medium text-slate-300 mb-1">Current Meter Reading</label>
                <input type="number" id="currReading" placeholder="e.g. 1750" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="unitRate" class="block text-sm font-medium text-slate-300 mb-1">Rate per Unit (₹/$)</label>
                    <input type="number" step="0.01" id="unitRate" value="6.50" placeholder="e.g. 6.50" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>
                <div>
                    <label for="splitCount" class="block text-sm font-medium text-slate-300 mb-1">Split Among (People)</label>
                    <input type="number" id="splitCount" value="1" min="1" placeholder="e.g. 2" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                </div>
            </div>
        </div>

        <!-- Real-time Results Card -->
        <div class="mt-6 p-5 rounded-xl bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-700/80 shadow-inner space-y-4">
            <div class="flex justify-between items-center text-sm text-slate-400">
                <span>Formula Applied:</span>
                <span class="font-mono text-xs text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded">(Current - Previous) × Rate</span>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-800">
                <div>
                    <span class="block text-xs text-slate-400 uppercase tracking-wider">Units Consumed</span>
                    <span id="diffUnits" class="text-2xl font-bold text-white">0</span>
                    <span class="text-xs text-slate-500 ml-1">kWh</span>
                </div>
                <div>
                    <span class="block text-xs text-slate-400 uppercase tracking-wider">Total Amount</span>
                    <span id="totalAmount" class="text-2xl font-bold text-emerald-400">₹0.00</span>
                </div>
            </div>

            <!-- Split Bill Breakdown Row -->
            <div id="splitSection" class="pt-3 border-t border-slate-800 flex justify-between items-center hidden">
                <div>
                    <span class="block text-xs text-slate-400 uppercase tracking-wider">Per Person Share</span>
                    <span id="splitCountLabel" class="text-xs text-emerald-400">Split among 1 person</span>
                </div>
                <span id="perPersonAmount" class="text-xl font-bold text-cyan-400">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Action Buttons (Placed outside capture area so buttons themselves aren't rendered inside the PNG) -->
    <div class="w-full max-w-lg mt-4 flex flex-col sm:flex-row gap-3">
        <button onclick="calculateBill()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200">
            Calculate Bill
        </button>
        <button onclick="exportToImage()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-cyan-600/20 transition duration-200 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Export to Image
        </button>
        <button onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium py-3 px-4 rounded-xl transition duration-200">
            Reset
        </button>
    </div>

    <script>
        // Helper function to show errors without alert()
        function showError(msg) {
            const box = document.getElementById('errorBox');
            const msgEl = document.getElementById('errorMessage');
            msgEl.innerText = msg;
            box.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }

        function calculateBill() {
            hideError();
            const prev = parseFloat(document.getElementById('prevReading').value);
            const curr = parseFloat(document.getElementById('currReading').value);
            const rate = parseFloat(document.getElementById('unitRate').value);
            const splitCount = parseInt(document.getElementById('splitCount').value) || 1;

            // Validation checks
            if (isNaN(prev) || isNaN(curr) || isNaN(rate)) {
                showError('Please enter valid numeric values for all fields.');
                return;
            }

            if (curr < prev) {
                showError('Current reading cannot be less than the previous reading.');
                return;
            }

            if (rate < 0) {
                showError('Rate per unit cannot be negative.');
                return;
            }

            if (splitCount < 1) {
                showError('Number of people to split with must be at least 1.');
                return;
            }

            // Calculation based on formula: (Current - Previous) * Rate
            const units = curr - prev;
            const total = units * rate;
            const perPerson = total / splitCount;

            // Update UI elements
            document.getElementById('diffUnits').innerText = units.toLocaleString();
            document.getElementById('totalAmount').innerText = '₹' + total.toFixed(2);

            // Handle Split View visibility & output
            const splitSection = document.getElementById('splitSection');
            if (splitCount > 1) {
                splitSection.classList.remove('hidden');
                document.getElementById('splitCountLabel').innerText = `Split among ${splitCount} people`;
                document.getElementById('perPersonAmount').innerText = '₹' + perPerson.toFixed(2);
            } else {
                splitSection.classList.add('hidden');
            }
        }

        function exportToImage() {
            const captureElement = document.getElementById('captureArea');
            html2canvas(captureElement, {
                scale: 2,
                backgroundColor: '#0f172a'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'eb-bill-summary.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                showError('Failed to export image. Please try again.');
            });
        }

        function resetForm() {
            document.getElementById('prevReading').value = '';
            document.getElementById('currReading').value = '';
            document.getElementById('unitRate').value = '6.50';
            document.getElementById('splitCount').value = '1';
            document.getElementById('diffUnits').innerText = '0';
            document.getElementById('totalAmount').innerText = '₹0.00';
            document.getElementById('splitSection').classList.add('hidden');
            hideError();
        }

        // Attach live listeners for instant calculations as user types
        ['prevReading', 'currReading', 'unitRate', 'splitCount'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                const prev = document.getElementById('prevReading').value;
                const curr = document.getElementById('currReading').value;
                const rate = document.getElementById('unitRate').value;
                if(prev !== '' && curr !== '' && rate !== '') {
                    calculateBill();
                }
            });
        });
    </script>
</body>
</html>
